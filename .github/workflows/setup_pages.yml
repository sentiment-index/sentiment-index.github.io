name: Setup Pages

on:
  schedule:
    - cron: '0 7 * * *'  # Midnight MST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  setup-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout sentiment data
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('source/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r source/requirements.txt

      - name: Run refresh_site.py
        working-directory: source
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          SENTIMENT_BASE_DIR: ../data/sentiment-files
          HTML_BASE_DIR: ../publish
        run: |
          python refresh_site.py

      - name: Assemble publish directory
        run: |
          mkdir -p publish

          cp -r source/docs/* publish/

          cp -r source/style.css publish/
          cp -r source/site-assets publish/
          
          echo "=== PUBLISH tree ==="
          ls -R publish

      - name: Remove old sentiment cache files
        run: |
          find data/sentiment-files -type f \( -name "*-scores-raw.json" -o -name "avg-scores.json" \) -delete

      - name: Commit updated sentiment data
        run: |
          cd data

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          git add sentiment-files

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Update sentiment data: ${TIMESTAMP}"
            git push origin data
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    needs: setup-pages

    permissions:
      pages: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4