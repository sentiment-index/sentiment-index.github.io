    <div class="wrapper">
        <script>

", "Inflation", "Phoenix", "Russia", "FBI", "Chuck Schumer", "Sabrina Carpenter", "NBA", "Elon Musk", "Selena Gomez", "Singapore", "Tyler Perry", "Mexico City", "Scott Bessent", "Mexico", "NATO", "Bad Bunny", "Star Wars", "Keir Starmer", "Joe Biden", "Congress", "Iran", "Marvel", "Larry Page", "Cristiano Ronaldo", "Football", "Sao Paolo", "Tom Holland", "Brazil", "Javier Milei", "Egypt", "Free Speech", "JD Vance", "California", "New York City", "Ford", "India", "Cats", "Chicago", "Beyonce", "Pennsylvania", "Hakeem Jeffries", "Netflix", "Taylor Swift"];

        <script src="site-assets/search.js"></script>

        <h1>Online Sentiment for “Russell Brand” is <span class="neutral">neutral</span></h1>

        <div class="score-change">
            <div class="score-block">
                <div class="label">Score</div>
                <div class="score neutral">0.000</div>
            </div>
            <div class="change-block">
                <div class="label">Change</div>
                <div class="change positive">↑ 0.000</div>
            </div>
        </div>

        <div class="range-selector">
            <button onclick="updateRange(30)">30D</button>
            <button onclick="updateRange(90)">90D</button>
            <button onclick="updateRange(365)">365D</button>
        </div>

        <canvas id="sentimentChart" width="800" height="400"></canvas>

        <div class="source-charts">

            <div class="source-chart">
                <h2>Reddit</h2>
                <canvas id="redditChart"></canvas>
            </div>

            <div class="source-chart">
                <h2>Bluesky</h2>
                <canvas id="blueskyChart"></canvas>
            </div>

        </div>
    </div>

    <script>
        const allLabels = [];
        const allScores = [];

        const redditScores = [];
        const blueskyScores = [];

        const ctx = document.getElementById('sentimentChart').getContext('2d');

        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(144, 238, 144, 0.3)');
        gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
        gradient.addColorStop(1, 'rgba(255, 182, 193, 0.2)');

        let sentimentChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: allLabels.slice(-30),
                datasets: [{
                    label: 'Internet Sentiment Index',
                    data: allScores.slice(-30),
                    fill: true,
                    borderColor: '#183660',
                    backgroundColor: gradient,
                    tension: 0.3,
                    pointRadius: 2,
                }]
            },
            options: {
                scales: {
                    y: {
                        min: -1,
                        max: 1,
                        grid: {
                            drawBorder: true,
                            color: function(context) {
                                if (context.tick.value === 0) {
                                    return '#000';
                                }
                                return '#e0e0e0';
                            },
                            lineWidth: function(context) {
                                return context.tick.value === 0 ? 2 : 1;
                            }
                        }
                    },
                    x: {
                        ticks: {
                            autoSkip: true,
                            maxTicksLimit: 10
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    }
                }
            }
        });

        function updateRange(days) {
            sentimentChart.data.labels = allLabels.slice(-days);
            sentimentChart.data.datasets[0].data = allScores.slice(-days);
            sentimentChart.update();
        }

        new Chart(
            document.getElementById('redditChart').getContext('2d'),
            {
                type: 'line',
                data: {
                    labels: allLabels,
                    datasets: [{
                        label: 'Reddit',
                        data: redditScores,
                        borderColor: '#ff4500',
                        tension: 0.3,
                        pointRadius: 0,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            min: -1,
                            max: 1
                        }
                    }
                }
            }
        );

        new Chart(
            document.getElementById('blueskyChart').getContext('2d'),
            {
                type: 'line',
                data: {
                    labels: allLabels,
                    datasets: [{
                        label: 'Bluesky',
                        data: blueskyScores,
                        borderColor: '#1185fe',
                        tension: 0.3,
                        pointRadius: 0,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            min: -1,
                            max: 1
                        }
                    }
                }
            }
        );
    </script>

    <div class="timenote">Last updated 11:10AM on June 21, 2026</div>

    </body>
    </html>
